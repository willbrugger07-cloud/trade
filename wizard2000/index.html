<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wizard 2000 — Bonus Buy Battle</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@400;600&display=swap');

    :root {
      --gold: #f0c040;
      --purple: #6a0dad;
      --deep: #0d001a;
      --win-green: #00ff88;
      --teal: #00d4d4;
      --red-glow: rgba(255,50,100,0.7);
      --blue-glow: rgba(50,150,255,0.7);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: radial-gradient(ellipse at center, #1a003a 0%, #0d001a 100%);
      min-height: 100vh;
      font-family: 'Cinzel', serif;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 8px 32px;
      gap: 14px;
    }

    /* Stars */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(1px 1px at 8% 12%, rgba(255,255,255,.5) 0%, transparent 100%),
        radial-gradient(1px 1px at 22% 55%, rgba(255,255,255,.4) 0%, transparent 100%),
        radial-gradient(1px 1px at 48% 8%,  rgba(255,255,255,.6) 0%, transparent 100%),
        radial-gradient(1px 1px at 65% 70%, rgba(255,255,255,.5) 0%, transparent 100%),
        radial-gradient(1px 1px at 80% 30%, rgba(255,255,255,.4) 0%, transparent 100%),
        radial-gradient(1px 1px at 92% 80%, rgba(255,255,255,.3) 0%, transparent 100%),
        radial-gradient(2px 2px at 35% 85%, rgba(200,150,255,.3) 0%, transparent 100%),
        radial-gradient(2px 2px at 72% 45%, rgba(150,200,255,.3) 0%, transparent 100%);
      pointer-events: none;
      z-index: 0;
    }

    .page { position: relative; z-index: 1; width: 100%; max-width: 1100px; display: flex; flex-direction: column; align-items: center; gap: 14px; }

    /* ── Title ── */
    .title { font-family: 'Cinzel Decorative', cursive; font-size: 2rem; font-weight: 900; background: linear-gradient(135deg,#ffd700,#ff8c00,#ffd700); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; filter: drop-shadow(0 0 12px rgba(255,180,0,.8)); letter-spacing: 2px; }
    .subtitle { font-size: .6rem; letter-spacing: 6px; color: #a080d0; text-transform: uppercase; margin-top: -4px; }

    /* ── Battle Arena ── */
    .arena {
      display: grid;
      grid-template-columns: 1fr 60px 1fr;
      gap: 10px;
      width: 100%;
      align-items: start;
    }

    /* ── Side Panel ── */
    .side-panel {
      background: linear-gradient(180deg, #18003a, #0d0025);
      border: 2px solid #5020a0;
      border-radius: 14px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 0 24px rgba(100,0,200,.35);
    }

    .side-panel.left-side  { border-color: #6040ff; box-shadow: 0 0 24px rgba(60,80,255,.4); }
    .side-panel.right-side { border-color: #ff4080; box-shadow: 0 0 24px rgba(255,50,130,.4); }

    .side-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: .65rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding-bottom: 6px;
      border-bottom: 1px solid rgba(128,0,255,.2);
    }

    .side-name { font-size: .8rem; font-weight: 700; }
    .left-side  .side-name { color: #8888ff; }
    .right-side .side-name { color: #ff88aa; }

    .side-total { font-family: 'Cinzel Decorative', cursive; font-size: 1rem; color: var(--gold); filter: drop-shadow(0 0 4px rgba(255,200,0,.5)); }

    /* ── Grid ── */
    .slot-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      grid-template-rows: repeat(4, 1fr);
      gap: 5px;
    }

    .cell {
      aspect-ratio: 1;
      background: linear-gradient(145deg, #1e0040, #12002a);
      border: 1px solid rgba(120,0,255,.25);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      transition: background .2s;
      min-height: 56px;
    }

    .cell .sym-icon { font-size: 1.5rem; line-height: 1; display: block; }
    .cell .sym-lbl  { font-size: .38rem; letter-spacing: 1px; color: rgba(255,255,255,.45); text-transform: uppercase; margin-top: 2px; }

    /* Multiplier overlay */
    .mult-badge {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Cinzel Decorative', cursive;
      font-size: 1rem;
      font-weight: 900;
      border-radius: 8px;
      pointer-events: none;
    }

    .cell.has-mult { border-color: #ffd700; }
    .cell.has-mult .mult-badge { background: rgba(0,0,0,.55); }
    .cell.mult-3   .mult-badge { color: #aaffaa; text-shadow: 0 0 8px #00ff88; }
    .cell.mult-4   .mult-badge { color: #80ddff; text-shadow: 0 0 8px #00d4d4; }
    .cell.mult-10  .mult-badge { color: #ff80aa; text-shadow: 0 0 8px #ff4080; }
    .cell.mult-20  .mult-badge { color: #ff8800; text-shadow: 0 0 10px #ff6600; }
    .cell.mult-100 .mult-badge { color: #ffd700; text-shadow: 0 0 14px #ffaa00, 0 0 28px #ff6600; font-size: 1.1rem; }

    /* Win flash */
    .cell.win-active {
      animation: cellWin .35s ease-in-out 4;
    }
    @keyframes cellWin {
      0%,100% { background: linear-gradient(145deg, #1e0040, #12002a); }
      50%      { background: linear-gradient(145deg, #3a0060, #280050); box-shadow: 0 0 14px rgba(200,100,255,.7); }
    }

    /* Spin animation */
    .cell.spinning { animation: cellSpin .1s linear infinite; }
    @keyframes cellSpin {
      0%   { transform: translateY(-3px); opacity: .5; }
      50%  { transform: none; opacity: 1; }
      100% { transform: translateY(3px); opacity: .5; }
    }

    /* Spin log */
    .spin-log {
      font-size: .6rem;
      color: #8070a0;
      min-height: 18px;
      letter-spacing: 1px;
    }

    .spin-log .log-win { color: var(--win-green); font-weight: 700; }

    /* ── VS column ── */
    .vs-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 12px;
      padding-top: 42px;
    }

    .vs-badge {
      font-family: 'Cinzel Decorative', cursive;
      font-size: 1.4rem;
      font-weight: 900;
      color: #cc44ff;
      filter: drop-shadow(0 0 10px rgba(200,50,255,.8));
    }

    .spin-counter {
      font-size: .55rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #8060a0;
      text-align: center;
    }

    .spin-counter span {
      font-family: 'Cinzel Decorative', cursive;
      font-size: 1.2rem;
      color: #fff;
      display: block;
    }

    /* ── Controls ── */
    .controls-row {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
    }

    .ctrl-group {
      background: rgba(80,0,180,.18);
      border: 1px solid rgba(120,0,255,.25);
      border-radius: 10px;
      padding: 8px 14px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .ctrl-lbl { font-size: .48rem; letter-spacing: 2px; color: #7050a0; text-transform: uppercase; }
    .ctrl-val { font-family: 'Cinzel Decorative', cursive; font-size: .95rem; color: var(--gold); }

    .bet-controls { display: flex; align-items: center; gap: 6px; }
    .bet-btn {
      background: rgba(100,0,220,.3);
      border: 1px solid rgba(120,0,255,.35);
      color: #cc88ff;
      font-size: .85rem;
      width: 22px; height: 22px;
      border-radius: 6px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all .15s;
    }
    .bet-btn:hover:not(:disabled) { background: rgba(120,0,255,.5); box-shadow: 0 0 6px rgba(120,0,255,.5); }
    .bet-btn:disabled { opacity: .4; cursor: not-allowed; }

    .battle-btn {
      background: linear-gradient(145deg, #6a00c8, #9000ff);
      border: 2px solid #cc44ff;
      border-radius: 12px;
      padding: 12px 32px;
      cursor: pointer;
      font-family: 'Cinzel Decorative', cursive;
      font-size: .85rem;
      letter-spacing: 2px;
      color: #fff;
      box-shadow: 0 0 20px rgba(180,0,255,.5);
      transition: all .15s;
      white-space: nowrap;
    }
    .battle-btn:hover:not(:disabled) { transform: scale(1.04); box-shadow: 0 0 30px rgba(180,0,255,.8); }
    .battle-btn:active:not(:disabled) { transform: scale(.97); }
    .battle-btn:disabled { opacity: .5; cursor: not-allowed; }

    .bonus-btn {
      background: linear-gradient(145deg, #a05000, #d07000);
      border: 2px solid #ffd700;
      border-radius: 12px;
      padding: 12px 24px;
      cursor: pointer;
      font-family: 'Cinzel Decorative', cursive;
      font-size: .75rem;
      letter-spacing: 1px;
      color: #fff;
      box-shadow: 0 0 16px rgba(255,180,0,.4);
      transition: all .15s;
      white-space: nowrap;
    }
    .bonus-btn:hover:not(:disabled) { transform: scale(1.04); box-shadow: 0 0 24px rgba(255,180,0,.7); }
    .bonus-btn:disabled { opacity: .5; cursor: not-allowed; }

    /* ── Result Banner ── */
    .result-banner {
      width: 100%;
      background: linear-gradient(90deg, #2a0060, #4a0090, #2a0060);
      border: 1px solid #8040d0;
      border-radius: 12px;
      padding: 14px 20px;
      display: none;
      text-align: center;
    }

    .result-banner.visible { display: block; animation: bannerIn .5s cubic-bezier(.34,1.56,.64,1); }
    @keyframes bannerIn { from { transform: scaleY(.3); opacity: 0; } to { transform: scaleY(1); opacity: 1; } }

    .result-title { font-family: 'Cinzel Decorative', cursive; font-size: 1.3rem; margin-bottom: 6px; }
    .result-title.left-win  { color: #8888ff; filter: drop-shadow(0 0 10px rgba(100,100,255,.8)); }
    .result-title.right-win { color: #ff88aa; filter: drop-shadow(0 0 10px rgba(255,80,150,.8)); }
    .result-title.tie       { color: var(--gold); filter: drop-shadow(0 0 10px rgba(255,200,0,.8)); }

    .result-detail { font-size: .7rem; color: #cc99ee; letter-spacing: 1px; }
    .result-payout { font-family: 'Cinzel Decorative', cursive; font-size: 1.5rem; color: var(--win-green); filter: drop-shadow(0 0 10px rgba(0,255,136,.7)); margin-top: 6px; }

    /* ── Status bar ── */
    .status-bar { font-size: .65rem; letter-spacing: 2px; color: #8060a0; min-height: 18px; text-align: center; }

    /* ── Phase indicators ── */
    .phase-badge {
      font-size: .5rem;
      letter-spacing: 2px;
      padding: 3px 8px;
      border-radius: 6px;
      text-transform: uppercase;
    }
    .phase-setup  { background: rgba(50,100,255,.2); border: 1px solid rgba(100,150,255,.4); color: #88aaff; }
    .phase-battle { background: rgba(200,50,255,.2); border: 1px solid rgba(200,100,255,.4); color: #dd88ff; }
    .phase-idle   { background: rgba(100,100,100,.15); border: 1px solid rgba(150,150,150,.2); color: #888; }

    /* paytable link */
    .info-row { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; justify-content: center; font-size: .6rem; color: #6050a0; letter-spacing: 1px; }
    .info-row span { cursor: default; }

    /* Multiplier placement animation */
    @keyframes multDrop {
      0%   { transform: scale(0) rotate(-20deg); opacity: 0; }
      60%  { transform: scale(1.15) rotate(3deg); }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }
    .cell.mult-just-placed .mult-badge { animation: multDrop .4s cubic-bezier(.34,1.56,.64,1); }
  </style>
</head>
<body>
<div class="page">
  <div class="title">Wizard 2000</div>
  <div class="subtitle">Bonus Buy Battle · Titan Gaming</div>

  <!-- Arena -->
  <div class="arena">
    <!-- Left side -->
    <div class="side-panel left-side" id="leftPanel">
      <div class="side-header">
        <div>
          <div class="side-name">⚔ HOUSE</div>
          <div class="phase-badge phase-idle" id="leftPhase">Idle</div>
        </div>
        <div style="text-align:right">
          <div style="font-size:.48rem;letter-spacing:1px;color:#6060a0;text-transform:uppercase">Total Win</div>
          <div class="side-total" id="leftTotal">$0.00</div>
        </div>
      </div>
      <div class="slot-grid" id="leftGrid"></div>
      <div class="spin-log" id="leftLog">&nbsp;</div>
    </div>

    <!-- VS column -->
    <div class="vs-col">
      <div class="vs-badge">VS</div>
      <div class="spin-counter">
        Spin<span id="spinCounter">—</span>of 10
      </div>
    </div>

    <!-- Right side -->
    <div class="side-panel right-side" id="rightPanel">
      <div class="side-header">
        <div>
          <div class="side-name">🧙 YOU</div>
          <div class="phase-badge phase-idle" id="rightPhase">Idle</div>
        </div>
        <div style="text-align:right">
          <div style="font-size:.48rem;letter-spacing:1px;color:#6060a0;text-transform:uppercase">Total Win</div>
          <div class="side-total" id="rightTotal">$0.00</div>
        </div>
      </div>
      <div class="slot-grid" id="rightGrid"></div>
      <div class="spin-log" id="rightLog">&nbsp;</div>
    </div>
  </div>

  <!-- Result -->
  <div class="result-banner" id="resultBanner">
    <div class="result-title" id="resultTitle"></div>
    <div class="result-detail" id="resultDetail"></div>
    <div class="result-payout" id="resultPayout"></div>
  </div>

  <!-- Controls -->
  <div class="controls-row">
    <div class="ctrl-group">
      <div class="ctrl-lbl">Balance</div>
      <div class="ctrl-val" id="balDisplay">$1,000.00</div>
    </div>
    <div class="ctrl-group">
      <div class="ctrl-lbl">Bet / Battle</div>
      <div class="bet-controls">
        <button class="bet-btn" id="betDown" onclick="changeBet(-1)">−</button>
        <div class="ctrl-val" id="betDisplay">$10.00</div>
        <button class="bet-btn" id="betUp" onclick="changeBet(1)">+</button>
      </div>
    </div>
    <button class="battle-btn" id="spinBtn" onclick="startBattle(false)">⚔ START BATTLE</button>
    <button class="bonus-btn" id="bonusBtn" onclick="startBattle(true)">🔮 BONUS BUY (×100)</button>
  </div>

  <div class="status-bar" id="statusBar">Place your bet and start the battle!</div>

  <div class="info-row">
    <span>5 Reels · 4 Rows · 20 Paylines</span>
    <span>·</span>
    <span>RTP 96.01%</span>
    <span>·</span>
    <span>Multipliers: 3× 4× 10× 20× 100×</span>
    <span>·</span>
    <span>Max Win 400,000×</span>
  </div>
</div>

<script>
'use strict';
// =============================================================
//  WIZARD 2000 — Bonus Buy Battle Engine
//  Two SlotInstance objects run simultaneously.
//  The side with the highest cumulative win after 10 spins
//  takes the combined pot. Sticky multipliers persist every spin.
// =============================================================

const ROWS = 4;
const COLS = 5;
const BATTLE_SPINS = 10;

// ── Symbols ──────────────────────────────────────────────────
const SYMBOLS = [
  { id: 'wild',      icon: '🧙',  label: 'WILD',     tier: 'special', baseWeight: 2  },
  { id: 'hour',      icon: '⏳',  label: 'HOURGLASS',tier: 'premium', baseWeight: 4  },
  { id: 'star',      icon: '🌟',  label: 'STAR',     tier: 'premium', baseWeight: 5  },
  { id: 'gem',       icon: '💎',  label: 'GEM',      tier: 'mid',     baseWeight: 8  },
  { id: 'scroll',    icon: '📜',  label: 'SCROLL',   tier: 'mid',     baseWeight: 8  },
  { id: 'potion',    icon: '🧪',  label: 'POTION',   tier: 'mid',     baseWeight: 9  },
  { id: 'A',         icon: '🔵',  label: 'A',        tier: 'low',     baseWeight: 13 },
  { id: 'K',         icon: '🟣',  label: 'K',        tier: 'low',     baseWeight: 13 },
  { id: 'Q',         icon: '🟤',  label: 'Q',        tier: 'low',     baseWeight: 13 },
  { id: 'J',         icon: '🟡',  label: 'J',        tier: 'low',     baseWeight: 13 },
  { id: '10',        icon: '⚪',  label: '10',       tier: 'low',     baseWeight: 13 },
];

const SYM_MAP = Object.fromEntries(SYMBOLS.map(s => [s.id, s]));

// Pay table: 3-of-a-kind / 4oaK / 5oaK multipliers (× bet)
const PAYS = {
  wild:   [10,  50,  250],
  hour:   [5,   25,  100],
  star:   [3,   15,   50],
  gem:    [2,   10,   30],
  scroll: [1.5,  7,   20],
  potion: [1,    4,   12],
  A:      [0.5,  2,    5],
  K:      [0.4, 1.5,   4],
  Q:      [0.3,  1,    3],
  J:      [0.25, .8,   2],
  '10':   [0.2, .6,  1.5],
};

// 20 paylines — [row, col] per reel (0-indexed, row 0 = top)
const PAYLINES = [
  [[1,0],[1,1],[1,2],[1,3],[1,4]], // row 1 straight
  [[2,0],[2,1],[2,2],[2,3],[2,4]], // row 2 straight
  [[0,0],[0,1],[0,2],[0,3],[0,4]], // row 0 straight
  [[3,0],[3,1],[3,2],[3,3],[3,4]], // row 3 straight
  [[1,0],[0,1],[1,2],[0,3],[1,4]], // zigzag up
  [[1,0],[2,1],[1,2],[2,3],[1,4]], // zigzag down
  [[0,0],[1,1],[2,2],[1,3],[0,4]], // V up
  [[3,0],[2,1],[1,2],[2,3],[3,4]], // V down
  [[0,0],[1,1],[2,2],[3,3],[3,4]], // diagonal TL-BR short
  [[3,0],[2,1],[1,2],[0,3],[0,4]], // diagonal BL-TR short
  [[0,0],[0,1],[1,2],[0,3],[0,4]], // top dip
  [[3,0],[3,1],[2,2],[3,3],[3,4]], // bottom dip
  [[1,0],[2,1],[3,2],[2,3],[1,4]], // W shape
  [[2,0],[1,1],[0,2],[1,3],[2,4]], // M shape
  [[0,0],[1,1],[0,2],[1,3],[0,4]], // top ripple
  [[3,0],[2,1],[3,2],[2,3],[3,4]], // bottom ripple
  [[2,0],[3,1],[2,2],[3,3],[2,4]], // row 2-3 saw
  [[1,0],[0,1],[2,2],[0,3],[1,4]], // wild ride
  [[0,0],[2,1],[2,2],[2,3],[0,4]], // canyon
  [[3,0],[1,1],[1,2],[1,3],[3,4]], // reverse canyon
];

// Sticky multiplier tiers
const MULT_TIERS = [3, 4, 10, 20, 100];

// Weighted pick of multiplier (lower = more likely)
function pickMult() {
  const weights = [40, 30, 15, 10, 5];
  const total = weights.reduce((a,b) => a+b, 0);
  let r = Math.random() * total;
  for (let i = 0; i < MULT_TIERS.length; i++) {
    r -= weights[i];
    if (r <= 0) return MULT_TIERS[i];
  }
  return MULT_TIERS[0];
}

// ── SlotInstance ──────────────────────────────────────────────
/**
 * Manages one side's 5×4 grid, spin logic, and sticky multiplier map.
 *
 * Sticky multipliers sit at specific (row, col) coordinates and
 * persist for all 10 battle spins. When a winning payline passes
 * through a multiplier cell, that mult is applied (multiple mults
 * on the same line multiply together, creating explosive variance).
 */
class SlotInstance {
  constructor(id) {
    this.id = id;         // 'left' | 'right'
    this.grid = [];       // grid[row][col] = symId string
    this.mults = {};      // key: `${row},${col}` → multiplier value
    this.totalWin = 0;
    this.spinHistory = [];
  }

  /** Reset for new battle */
  reset() {
    this.grid = [];
    this.mults = {};
    this.totalWin = 0;
    this.spinHistory = [];
  }

  /**
   * SETUP PHASE — place 3–5 sticky multipliers on the grid.
   * Higher bonus buy cost = more/higher multipliers placed.
   * Returns the positions placed.
   */
  placeMultipliers(isBonusBuy) {
    this.mults = {};
    const count = isBonusBuy
      ? Math.floor(Math.random() * 2) + 4   // 4–5 mults on bonus buy
      : Math.floor(Math.random() * 2) + 3;  // 3–4 on base trigger

    const positions = new Set();
    while (positions.size < count) {
      const r = Math.floor(Math.random() * ROWS);
      const c = Math.floor(Math.random() * COLS);
      positions.add(`${r},${c}`);
    }

    for (const pos of positions) {
      this.mults[pos] = pickMult();
    }

    return positions;
  }

  /** Spin the reels (random symbol per cell, excluding scatter during battle) */
  spin(volatility) {
    this.grid = [];
    const symKeys = SYMBOLS.filter(s => s.id !== 'wild').map(s => s.id);
    const allKeys = SYMBOLS.map(s => s.id);
    const weights = SYMBOLS.map(s => {
      if (volatility === 'low')    return s.baseWeight * (s.tier === 'low' ? 1.3 : 0.8);
      if (volatility === 'high')   return s.baseWeight * (s.tier === 'premium' || s.tier === 'special' ? 1.4 : 0.85);
      return s.baseWeight;
    });
    const total = weights.reduce((a,b) => a+b, 0);

    for (let r = 0; r < ROWS; r++) {
      this.grid[r] = [];
      for (let c = 0; c < COLS; c++) {
        let rand = Math.random() * total;
        let chosen = allKeys[allKeys.length-1];
        for (let i = 0; i < allKeys.length; i++) {
          rand -= weights[i];
          if (rand <= 0) { chosen = allKeys[i]; break; }
        }
        this.grid[r][c] = chosen;
      }
    }
  }

  /**
   * Evaluate all 20 paylines.
   * Wild substitutes for any non-special symbol.
   * For each winning line, multiply the base pay by any sticky
   * multiplier cells the line passes through. Multiple mults
   * on the same line are COMBINED (multiplied together) — this
   * is what causes the explosive high-volatility payouts.
   */
  evaluate(bet) {
    let spinWin = 0;
    let winCells = new Set();
    let details = [];

    for (const line of PAYLINES) {
      const cells = line.map(([r,c]) => ({ r, c, sym: this.grid[r][c] }));
      // Count matching from left; wild acts as sub
      let matchSym = null;
      let count = 0;

      for (let i = 0; i < COLS; i++) {
        const s = cells[i].sym;
        if (s === 'wild') {
          count++;
        } else if (matchSym === null) {
          matchSym = s;
          count++;
        } else if (s === matchSym) {
          count++;
        } else {
          break;
        }
      }

      if (!matchSym || count < 3 || !PAYS[matchSym]) continue;

      const payIdx   = count - 3;         // 0=3oaK, 1=4oaK, 2=5oaK
      const basePay  = PAYS[matchSym][payIdx];

      // Collect sticky mult cells on this line segment
      let lineMult = 1;
      for (let i = 0; i < count; i++) {
        const key = `${cells[i].r},${cells[i].c}`;
        if (this.mults[key]) lineMult *= this.mults[key];
      }

      const win = bet * basePay * lineMult;
      spinWin  += win;

      for (let i = 0; i < count; i++) winCells.add(`${cells[i].r},${cells[i].c}`);
      details.push({ sym: matchSym, count, basePay, lineMult, win });
    }

    this.totalWin += spinWin;
    this.spinHistory.push(spinWin);
    return { spinWin, winCells, details };
  }
}

// ── BattleEngine ──────────────────────────────────────────────
/**
 * Orchestrates a 10-spin duel between leftSlot and rightSlot.
 * Each spin is simultaneously resolved on both sides.
 * Winner = side with higher totalWin; they collect BOTH sides' wins.
 */
class BattleEngine {
  constructor() {
    this.left  = new SlotInstance('left');
    this.right = new SlotInstance('right');
    this.spinsDone = 0;
    this.running   = false;
    this.volatility = 'medium';
  }

  reset() {
    this.left.reset();
    this.right.reset();
    this.spinsDone = 0;
  }
}

// ── Global state ─────────────────────────────────────────────
const engine = new BattleEngine();
let balance  = 1000;
const betLevels = [1, 2, 5, 10, 20, 50, 100, 200];
let betIdx   = 3; // $10 default
let bet      = betLevels[betIdx];
let isRunning = false;

// ── DOM helpers ───────────────────────────────────────────────
function buildGrid(id) {
  const container = document.getElementById(id);
  container.innerHTML = '';
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.id = `${id}-${r}-${c}`;
      cell.innerHTML = `<span class="sym-icon">🔮</span><span class="sym-lbl">---</span>`;
      container.appendChild(cell);
    }
  }
}

function renderCell(gridId, row, col, symId, mults, flashMult) {
  const cell = document.getElementById(`${gridId}-${row}-${col}`);
  const sym  = SYM_MAP[symId] || SYM_MAP['10'];

  // Clear old
  cell.className = 'cell';
  const multKey = `${row},${col}`;
  const multVal = mults && mults[multKey];

  cell.innerHTML = `<span class="sym-icon">${sym.icon}</span><span class="sym-lbl">${sym.label}</span>`;

  if (multVal) {
    cell.classList.add('has-mult', `mult-${multVal}`);
    if (flashMult) cell.classList.add('mult-just-placed');
    const badge = document.createElement('div');
    badge.className = 'mult-badge';
    badge.textContent = `×${multVal}`;
    cell.appendChild(badge);
  }
}

function renderGrid(side) {
  const slot = side === 'left' ? engine.left : engine.right;
  const gridId = side === 'left' ? 'leftGrid' : 'rightGrid';
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      renderCell(gridId, r, c, slot.grid[r]?.[c] || '10', slot.mults, false);
    }
  }
}

function flashCells(gridId, winCells) {
  for (const key of winCells) {
    const [r,c] = key.split(',').map(Number);
    const cell = document.getElementById(`${gridId}-${r}-${c}`);
    if (!cell) continue;
    cell.classList.remove('win-active');
    void cell.offsetWidth;
    cell.classList.add('win-active');
    setTimeout(() => cell.classList.remove('win-active'), 1500);
  }
}

function setSpinAnim(gridId, on) {
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++) {
      const cell = document.getElementById(`${gridId}-${r}-${c}`);
      if (cell) cell.classList.toggle('spinning', on);
    }
}

function setPhase(side, phase) {
  const el = document.getElementById(side + 'Phase');
  el.className = `phase-badge phase-${phase}`;
  el.textContent = phase === 'setup' ? 'Setup' : phase === 'battle' ? 'Battle' : 'Idle';
}

function fmt(n) {
  return '$' + n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function setUI(enabled) {
  document.getElementById('spinBtn').disabled  = !enabled;
  document.getElementById('bonusBtn').disabled = !enabled;
  document.getElementById('betDown').disabled  = !enabled;
  document.getElementById('betUp').disabled    = !enabled;
}

function setStatus(msg) { document.getElementById('statusBar').textContent = msg; }

function delay(ms) { return new Promise(r => setTimeout(r, ms)); }

function updateTotals() {
  document.getElementById('leftTotal').textContent  = fmt(engine.left.totalWin);
  document.getElementById('rightTotal').textContent = fmt(engine.right.totalWin);
  document.getElementById('balDisplay').textContent = fmt(balance);
}

// ── Battle flow ───────────────────────────────────────────────
async function startBattle(isBonusBuy) {
  if (isRunning) return;

  const cost = isBonusBuy ? bet * 100 : bet;
  if (balance < cost) { setStatus('Insufficient balance!'); return; }

  balance -= cost;
  isRunning = true;
  setUI(false);
  document.getElementById('resultBanner').classList.remove('visible');
  engine.reset();
  updateTotals();
  document.getElementById('spinCounter').textContent = '—';

  // ── PHASE 1: Setup — place multipliers ─────────────────────
  setStatus('Placing sticky multipliers…');
  setPhase('left',  'setup');
  setPhase('right', 'setup');

  // Spin blank grid first
  engine.left.spin('medium');
  engine.right.spin('medium');
  renderGrid('left');
  renderGrid('right');

  await delay(400);

  // Place multipliers with animation stagger
  engine.left.placeMultipliers(isBonusBuy);
  engine.right.placeMultipliers(isBonusBuy);

  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const lKey = `${r},${c}`;
      const rKey = `${r},${c}`;
      if (engine.left.mults[lKey] || engine.right.mults[rKey]) {
        renderCell('leftGrid',  r, c, engine.left.grid[r]?.[c]  || '10', engine.left.mults,  true);
        renderCell('rightGrid', r, c, engine.right.grid[r]?.[c] || '10', engine.right.mults, true);
        await delay(80);
      }
    }
  }

  setStatus(`${Object.keys(engine.left.mults).length} multipliers placed on House · ${Object.keys(engine.right.mults).length} on You`);
  await delay(700);

  // ── PHASE 2: Battle spins ───────────────────────────────────
  setPhase('left',  'battle');
  setPhase('right', 'battle');

  for (let spin = 1; spin <= BATTLE_SPINS; spin++) {
    document.getElementById('spinCounter').textContent = spin;
    setStatus(`Spin ${spin} of ${BATTLE_SPINS}…`);

    // Start spin animation
    setSpinAnim('leftGrid',  true);
    setSpinAnim('rightGrid', true);
    await delay(400 + Math.random() * 150);

    // Generate results
    engine.left.spin(engine.volatility);
    engine.right.spin(engine.volatility);

    // Stop left, then right with slight stagger
    setSpinAnim('leftGrid', false);
    renderGrid('left');
    await delay(80);
    setSpinAnim('rightGrid', false);
    renderGrid('right');
    await delay(120);

    // Evaluate
    const lResult = engine.left.evaluate(bet);
    const rResult = engine.right.evaluate(bet);

    // Flash wins
    if (lResult.winCells.size) flashCells('leftGrid',  lResult.winCells);
    if (rResult.winCells.size) flashCells('rightGrid', rResult.winCells);

    // Log
    document.getElementById('leftLog').innerHTML  = buildLogHtml(lResult, spin);
    document.getElementById('rightLog').innerHTML = buildLogHtml(rResult, spin);

    updateTotals();
    await delay(700);
  }

  // ── PHASE 3: Result ─────────────────────────────────────────
  setPhase('left',  'idle');
  setPhase('right', 'idle');
  showResult(isBonusBuy, cost);
  isRunning = false;
  setUI(true);
}

function buildLogHtml(result, spin) {
  if (!result.details.length) return `Spin ${spin}: <span style="color:#666">No win</span>`;
  const parts = result.details.map(d => {
    const sym = SYM_MAP[d.sym];
    const multNote = d.lineMult > 1 ? ` <span style="color:#ffd700">×${d.lineMult}</span>` : '';
    return `${sym.icon}×${d.count}${multNote}`;
  }).join(' | ');
  return `Spin ${spin}: <span class="log-win">${fmt(result.spinWin)}</span> — ${parts}`;
}

function showResult(isBonusBuy, cost) {
  const lWin = engine.left.totalWin;
  const rWin = engine.right.totalWin;
  const pot  = lWin + rWin;
  const banner = document.getElementById('resultBanner');
  const title  = document.getElementById('resultTitle');
  const detail = document.getElementById('resultDetail');
  const payout = document.getElementById('resultPayout');

  banner.classList.add('visible');

  if (Math.abs(lWin - rWin) < 0.001) {
    title.className = 'result-title tie';
    title.textContent = '⚖ TIE — All Returns Void';
    detail.textContent = `House: ${fmt(lWin)} · You: ${fmt(rWin)} · Bet recovered`;
    payout.textContent = fmt(cost);
    balance += cost;
  } else if (lWin > rWin) {
    title.className = 'result-title left-win';
    title.textContent = '⚔ HOUSE WINS';
    detail.textContent = `House: ${fmt(lWin)} · You: ${fmt(rWin)} · Pot: ${fmt(pot)}`;
    payout.textContent = 'You lose — Try again!';
  } else {
    title.className = 'result-title right-win';
    title.textContent = '🧙 YOU WIN THE BATTLE!';
    detail.textContent = `You: ${fmt(rWin)} · House: ${fmt(lWin)} · Combined pot: ${fmt(pot)}`;
    payout.textContent = fmt(pot);
    balance += pot;
    setStatus(`You collect ${fmt(pot)}! (${(pot/cost).toFixed(1)}× your bet)`);
  }

  updateTotals();
  document.getElementById('balDisplay').textContent = fmt(balance);

  if (lWin <= rWin) {
    setStatus(rWin > lWin ? `Victory! Collected ${fmt(pot)} (${(pot/cost).toFixed(1)}× return)` : 'Tie — bet returned.');
  } else {
    setStatus('The House wins this battle. Spin again!');
  }
}

// ── Bet controls ──────────────────────────────────────────────
function changeBet(dir) {
  betIdx = Math.max(0, Math.min(betLevels.length - 1, betIdx + dir));
  bet    = betLevels[betIdx];
  document.getElementById('betDisplay').textContent = fmt(bet);
}

// ── Init ──────────────────────────────────────────────────────
buildGrid('leftGrid');
buildGrid('rightGrid');
updateTotals();
</script>
</body>
</html>
