<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Wizard 2000</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@400;600&display=swap');

*{box-sizing:border-box;margin:0;padding:0;}
body{
  background:radial-gradient(ellipse at 50% 20%,#1c0040 0%,#080014 75%);
  min-height:100vh;display:flex;flex-direction:column;align-items:center;
  justify-content:center;font-family:'Cinzel',serif;color:#fff;
  padding:12px 8px 24px;gap:10px;overflow-x:hidden;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(1.5px 1.5px at 7% 12%,rgba(255,255,255,.55) 0%,transparent 100%),
    radial-gradient(1px 1px at 19% 68%,rgba(255,255,255,.4) 0%,transparent 100%),
    radial-gradient(1.5px 1.5px at 38% 6%,rgba(255,255,255,.65) 0%,transparent 100%),
    radial-gradient(1px 1px at 54% 85%,rgba(255,255,255,.45) 0%,transparent 100%),
    radial-gradient(1px 1px at 72% 22%,rgba(255,255,255,.5) 0%,transparent 100%),
    radial-gradient(1px 1px at 88% 58%,rgba(255,255,255,.4) 0%,transparent 100%),
    radial-gradient(1px 1px at 93% 8%,rgba(255,255,255,.5) 0%,transparent 100%),
    radial-gradient(1px 1px at 28% 42%,rgba(255,255,255,.3) 0%,transparent 100%),
    radial-gradient(2px 2px at 62% 50%,rgba(180,100,255,.3) 0%,transparent 100%),
    radial-gradient(2px 2px at 45% 78%,rgba(100,160,255,.25) 0%,transparent 100%);
}

.wrap{position:relative;z-index:1;width:100%;max-width:660px;display:flex;flex-direction:column;align-items:center;gap:10px;}

/* ── Title ── */
.title{
  font-family:'Cinzel Decorative',cursive;font-size:2.2rem;font-weight:900;
  background:linear-gradient(135deg,#ffd700,#ff8c00,#ffd700);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  filter:drop-shadow(0 0 16px rgba(255,170,0,.9));letter-spacing:3px;
  line-height:1;
}
.sub{font-size:.5rem;letter-spacing:7px;color:#8050b0;text-transform:uppercase;margin-top:-2px;}

/* ── Slot machine frame ── */
.machine{
  width:100%;
  background:linear-gradient(180deg,#160036 0%,#0a0020 100%);
  border:2px solid #5018a0;border-radius:18px;
  padding:14px;
  box-shadow:0 0 40px rgba(80,0,200,.35),inset 0 0 40px rgba(60,0,150,.15);
  display:flex;flex-direction:column;gap:10px;
}

/* ── Reel grid 5×5 ── */
.reel-grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  grid-template-rows:repeat(5,1fr);
  gap:5px;
  border:1px solid rgba(100,0,220,.2);
  border-radius:10px;
  padding:5px;
  background:rgba(0,0,0,.25);
}

/* ── Cell ── */
.cell{
  aspect-ratio:1;min-height:50px;
  background:linear-gradient(145deg,#1a0036,#0e0020);
  border:1px solid rgba(100,0,200,.2);
  border-radius:8px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  position:relative;overflow:hidden;
  user-select:none;
}
.cell .icon{font-size:1.4rem;line-height:1;display:block;transition:transform .1s;}
.cell .lbl{font-size:.32rem;letter-spacing:.8px;color:rgba(255,255,255,.35);text-transform:uppercase;margin-top:1px;}

/* spinning */
.cell.spin{animation:cellSpin .08s linear infinite;}
@keyframes cellSpin{
  0%{opacity:.3;transform:translateY(-4px);}
  50%{opacity:1;transform:none;}
  100%{opacity:.3;transform:translateY(4px);}
}

/* win flash */
.cell.wflash{animation:wf .32s ease-in-out 5;}
@keyframes wf{
  0%,100%{background:linear-gradient(145deg,#1a0036,#0e0020);}
  50%{background:linear-gradient(145deg,#360060,#1e0040);box-shadow:0 0 14px rgba(180,80,255,.75);}
}

/* ── Wizard reel ── */
.cell.wiz{
  background:linear-gradient(145deg,#320060,#1c0040)!important;
  border-color:#bb33ff!important;
}
.cell.wiz .icon{animation:wglow 1.1s ease-in-out infinite alternate;}
@keyframes wglow{
  from{filter:drop-shadow(0 0 3px #aa22ff);}
  to{filter:drop-shadow(0 0 12px #ff88ff);transform:scale(1.1);}
}

/* multiplier badge — shown on middle row of a wizard reel */
.mbadge{
  position:absolute;inset:0;border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  font-family:'Cinzel Decorative',cursive;font-weight:900;
  pointer-events:none;
  background:rgba(5,0,18,.55);
}
.m-s{font-size:.85rem;color:#88eeff;text-shadow:0 0 8px #00ccff;}
.m-m{font-size:.85rem;color:#ff88cc;text-shadow:0 0 8px #ff33aa;}
.m-b{font-size:.85rem;color:#ffaa22;text-shadow:0 0 10px #ff6600,0 0 20px #ff2200;}
.m-x{font-size:.9rem;color:#ffd700;text-shadow:0 0 14px #ffaa00,0 0 28px #ff5500,0 0 44px #ff0000;}

/* sticky pip */
.spip{
  position:absolute;top:3px;right:3px;
  background:rgba(160,40,255,.85);color:#fff;
  font-size:.3rem;letter-spacing:.5px;padding:1px 4px;border-radius:3px;
  text-transform:uppercase;
}

/* ── Wizard reveal overlay (on middle cell during animation) ── */
.reveal{
  position:absolute;inset:0;z-index:20;border-radius:8px;
  background:rgba(4,0,18,.8);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
}
.ropt{
  font-family:'Cinzel Decorative',cursive;font-weight:900;font-size:.9rem;
  padding:3px 9px;border-radius:6px;
  background:rgba(50,0,100,.6);border:1px solid rgba(200,100,255,.25);
  transition:all .35s;
}
.ropt.pick{
  background:linear-gradient(135deg,rgba(100,0,220,.9),rgba(60,0,160,.9));
  border-color:#cc44ff;box-shadow:0 0 12px rgba(180,60,255,.8);
  transform:scale(1.18);
}
.ropt.drop{opacity:0;transform:scale(.4);}

/* ── Reel drop animation ── */
@keyframes reelDrop{
  0%{transform:translateY(-110%) scale(.6);opacity:0;}
  65%{transform:translateY(6%) scale(1.06);opacity:1;}
  100%{transform:translateY(0) scale(1);opacity:1;}
}
.dropping{animation:reelDrop .48s cubic-bezier(.34,1.15,.64,1);}

/* ── Win display ── */
.win-row{
  display:flex;align-items:center;justify-content:center;gap:10px;min-height:30px;
}
.win-amt{
  font-family:'Cinzel Decorative',cursive;font-size:1.5rem;
  color:#00ff88;filter:drop-shadow(0 0 10px rgba(0,255,136,.8));
  display:none;
  animation:winPop .4s cubic-bezier(.34,1.56,.64,1);
}
.win-amt.show{display:block;}
@keyframes winPop{from{transform:scale(.3);opacity:0;}to{transform:scale(1);opacity:1;}}
.win-lbl{font-size:.5rem;letter-spacing:3px;color:#40c070;text-transform:uppercase;display:none;}
.win-lbl.show{display:block;}
.win-det{font-size:.52rem;color:#9966cc;display:none;text-align:center;}
.win-det.show{display:block;}

/* ── Scatter row ── */
.scatter-row{
  display:flex;align-items:center;justify-content:center;gap:6px;
}
.sdot{
  width:9px;height:9px;border-radius:50%;
  border:1px solid rgba(255,215,0,.3);background:rgba(255,215,0,.08);
  transition:all .3s;
}
.sdot.lit{
  background:radial-gradient(circle,#ffd700,#ff8800);
  border-color:#ffd700;box-shadow:0 0 6px rgba(255,200,0,.9);
}
.scatter-lbl{font-size:.45rem;letter-spacing:2px;color:#6050a0;text-transform:uppercase;}

/* ── Free spins banner ── */
.fs-banner{
  display:none;
  background:linear-gradient(90deg,#380070,#5a00a8,#380070);
  border:1px solid #aa33ff;border-radius:8px;
  padding:5px 14px;text-align:center;
  font-size:.6rem;letter-spacing:2px;color:#ddaaff;text-transform:uppercase;
  animation:fsPulse 2s ease-in-out infinite;
}
.fs-banner.show{display:block;}
@keyframes fsPulse{
  0%,100%{box-shadow:0 0 6px rgba(170,50,255,.3);}
  50%{box-shadow:0 0 18px rgba(170,50,255,.8);}
}
.fs-banner span{color:#ffd700;font-weight:700;font-size:1.1em;}

/* ── Controls ── */
.ctrl-row{
  display:grid;grid-template-columns:1fr auto 1fr;
  gap:8px;align-items:center;width:100%;
}
.stat{
  background:rgba(60,0,150,.18);border:1px solid rgba(100,0,200,.22);
  border-radius:10px;padding:7px 10px;
}
.stat-lbl{font-size:.4rem;letter-spacing:2px;color:#6040a0;text-transform:uppercase;}
.stat-val{font-family:'Cinzel Decorative',cursive;font-size:.95rem;color:#f0c040;
  filter:drop-shadow(0 0 4px rgba(255,195,0,.4));}

.bet-stat{display:flex;align-items:center;gap:5px;}
.bb{
  background:rgba(80,0,180,.3);border:1px solid rgba(100,0,200,.3);
  color:#bb88ff;font-size:.8rem;width:20px;height:20px;border-radius:5px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all .12s;
}
.bb:hover:not(:disabled){background:rgba(110,0,240,.5);box-shadow:0 0 5px rgba(130,0,255,.5);}
.bb:disabled{opacity:.3;cursor:not-allowed;}

/* ── Spin button ── */
.spin-btn{
  background:linear-gradient(145deg,#5200a8,#8000e0);
  border:2px solid #aa33ff;border-radius:50%;
  width:78px;height:78px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-family:'Cinzel Decorative',cursive;font-size:.52rem;letter-spacing:2px;color:#fff;
  box-shadow:0 0 22px rgba(150,0,255,.55),0 4px 14px rgba(0,0,0,.5);
  transition:all .13s;position:relative;overflow:hidden;
}
.spin-btn::before{
  content:'';position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.14),transparent 60%);
}
.spin-btn:hover:not(:disabled){transform:scale(1.06);box-shadow:0 0 32px rgba(150,0,255,.85),0 6px 18px rgba(0,0,0,.5);}
.spin-btn:active:not(:disabled){transform:scale(.96);}
.spin-btn:disabled{opacity:.5;cursor:not-allowed;}
.spin-btn .si{font-size:1.7rem;display:block;margin-bottom:2px;}
.spin-btn.go .si{animation:spinIcon .45s linear infinite;}
@keyframes spinIcon{from{transform:rotate(0)}to{transform:rotate(360deg)}}

/* ── Bottom row: volatility + last win ── */
.bot-row{display:flex;gap:8px;align-items:stretch;width:100%;}
.vol-box{
  background:rgba(60,0,150,.18);border:1px solid rgba(100,0,200,.22);
  border-radius:10px;padding:7px 10px;flex:1;
}
.vol-lbl{font-size:.4rem;letter-spacing:2px;color:#6040a0;text-transform:uppercase;margin-bottom:5px;}
.vol-opts{display:flex;gap:5px;}
.vopt{
  flex:1;padding:4px 2px;border-radius:6px;text-align:center;
  border:1px solid rgba(100,0,200,.25);background:rgba(80,0,180,.1);
  color:#7050a0;font-size:.5rem;letter-spacing:1px;cursor:pointer;transition:all .15s;
}
.vopt.on{
  background:linear-gradient(135deg,#4400a0,#7000cc);
  border-color:#aa33ff;color:#fff;box-shadow:0 0 7px rgba(160,0,255,.4);
}

.lastwin-box{
  background:rgba(60,0,150,.18);border:1px solid rgba(100,0,200,.22);
  border-radius:10px;padding:7px 10px;flex:1;
}

/* ── Status ── */
.status{font-size:.55rem;letter-spacing:1.5px;color:#6050a0;min-height:14px;text-align:center;}

/* ── Big win overlay ── */
.bigwin{
  position:fixed;inset:0;background:rgba(0,0,0,.88);
  display:none;flex-direction:column;align-items:center;justify-content:center;
  z-index:100;gap:10px;
}
.bigwin.show{display:flex;}
.bwl{
  font-family:'Cinzel Decorative',cursive;font-size:2.6rem;font-weight:900;
  background:linear-gradient(135deg,#ffd700,#ff5500);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  filter:drop-shadow(0 0 22px rgba(255,140,0,.95));
  animation:bwpop .5s cubic-bezier(.34,1.56,.64,1);
}
.bwa{
  font-family:'Cinzel Decorative',cursive;font-size:1.9rem;
  color:#00ff88;filter:drop-shadow(0 0 14px rgba(0,255,136,.9));
  animation:bwpop .5s .18s cubic-bezier(.34,1.56,.64,1) both;
}
@keyframes bwpop{from{transform:scale(.15) rotate(-12deg);opacity:0;}to{transform:scale(1) rotate(0);opacity:1;}}
.bwc{
  background:linear-gradient(135deg,#5200a8,#8000e0);
  border:2px solid #aa33ff;border-radius:10px;padding:10px 28px;
  cursor:pointer;font-family:'Cinzel Decorative',cursive;
  font-size:.75rem;letter-spacing:2px;color:#fff;
  animation:bwpop .5s .35s cubic-bezier(.34,1.56,.64,1) both;
  transition:all .13s;
}
.bwc:hover{box-shadow:0 0 18px rgba(160,0,255,.8);transform:scale(1.05);}
</style>
</head>
<body>

<div class="bigwin" id="bigwin">
  <div class="bwl" id="bwl">MEGA WIN!</div>
  <div class="bwa" id="bwa"></div>
  <button class="bwc" onclick="document.getElementById('bigwin').classList.remove('show')">COLLECT</button>
</div>

<div class="wrap">
  <div class="title">Wizard 2000</div>
  <div class="sub">by Titan Gaming</div>

  <div class="machine">

    <!-- free spins banner -->
    <div class="fs-banner" id="fsBanner">
      FREE SPINS — <span id="fsNum">0</span> remaining · Wizard Wilds Sticky
    </div>

    <!-- reel grid -->
    <div class="reel-grid" id="grid"></div>

    <!-- win display -->
    <div class="win-row">
      <div class="win-lbl" id="wlbl">WIN</div>
      <div class="win-amt" id="wamt"></div>
    </div>
    <div class="win-det" id="wdet"></div>

    <!-- scatter tracker -->
    <div class="scatter-row">
      <span class="scatter-lbl">Bonus</span>
      <div class="sdot" id="s0"></div>
      <div class="sdot" id="s1"></div>
      <div class="sdot" id="s2"></div>
      <span class="scatter-lbl">= Free Spins</span>
    </div>

    <!-- main controls -->
    <div class="ctrl-row">
      <div class="stat">
        <div class="stat-lbl">Balance</div>
        <div class="stat-val" id="bal">$1,000.00</div>
      </div>
      <button class="spin-btn" id="spinBtn" onclick="spin()">
        <span class="si">🌀</span>
        <span>SPIN</span>
      </button>
      <div class="stat">
        <div class="stat-lbl">Bet</div>
        <div class="bet-stat">
          <button class="bb" id="bdn" onclick="chgBet(-1)">−</button>
          <span class="stat-val" id="betVal">$1.00</span>
          <button class="bb" id="bup" onclick="chgBet(1)">+</button>
        </div>
      </div>
    </div>

    <!-- bottom row -->
    <div class="bot-row">
      <div class="vol-box">
        <div class="vol-lbl">Volatility</div>
        <div class="vol-opts">
          <div class="vopt" onclick="setVol('low',this)">Low</div>
          <div class="vopt on" onclick="setVol('med',this)">Med</div>
          <div class="vopt" onclick="setVol('high',this)">High</div>
        </div>
      </div>
      <div class="lastwin-box">
        <div class="stat-lbl">Last Win</div>
        <div class="stat-val" id="lastWin">$0.00</div>
      </div>
    </div>

    <div class="status" id="status">Spin to play! · 3 Bonus symbols = 10 Free Spins</div>
  </div>
</div>

<script>
'use strict';
// ═══════════════════════════════════════════════════════════
//  WIZARD 2000  —  faithful recreation
//
//  5 reels × 5 rows, 15 paylines.
//
//  Wizard Wild mechanic:
//   • Wizard symbol can land on any reel (max 1 per reel).
//   • When it lands, the WHOLE reel expands to Wizard Wild.
//   • Two random multiplier values are revealed.
//   • The wizard "picks" one — shown with a selection animation.
//   • That multiplier applies to every winning line through
//     that reel this spin (and every remaining free spin if sticky).
//   • Multiple wizard reels on the same line → multipliers ADD.
//
//  Scatter / Free Spins:
//   • 3+ Bonus (scatter) symbols anywhere → 10 free spins.
//   • During free spins wizard wilds are STICKY — they stay on
//     their reel for every remaining spin, with their multiplier.
//   • Extra scatters during free spins add +5 spins each.
// ═══════════════════════════════════════════════════════════

const R = 5, C = 5;

// ── Symbol table ──────────────────────────────────────────
const SYMS = [
  // id, emoji, label, weight-low, weight-med, weight-high
  {id:'wiz',    e:'🧙', l:'WIZARD',  wL:0,  wM:0,  wH:0 }, // injected separately
  {id:'bonus',  e:'⭐', l:'BONUS',   wL:3,  wM:3,  wH:3 }, // scatter
  {id:'hour',   e:'⌛', l:'HR',      wL:3,  wM:4,  wH:5 },
  {id:'star',   e:'🌟', l:'STAR',    wL:4,  wM:5,  wH:6 },
  {id:'gem',    e:'💎', l:'GEM',     wL:7,  wM:8,  wH:8 },
  {id:'scroll', e:'📜', l:'SCROLL',  wL:8,  wM:9,  wH:9 },
  {id:'potion', e:'🧪', l:'POTION',  wL:9,  wM:9,  wH:8 },
  {id:'A',      e:'🔵', l:'A',       wL:14, wM:13, wH:11},
  {id:'K',      e:'🟣', l:'K',       wL:14, wM:13, wH:11},
  {id:'Q',      e:'🟤', l:'Q',       wL:14, wM:12, wH:10},
  {id:'J',      e:'🟡', l:'J',       wL:14, wM:12, wH:10},
  {id:'10',     e:'⚪', l:'10',      wL:14, wM:12, wH:10},
];
const SYM = Object.fromEntries(SYMS.map(s=>[s.id,s]));

// Paytable: [3-of-a-kind, 4oaK, 5oaK] × bet
const PAY = {
  wiz:   [20, 100, 400],
  hour:  [5,   25, 100],
  star:  [3,   15,  60],
  gem:   [2,   10,  35],
  scroll:[1.5,  7,  22],
  potion:[1,    4,  14],
  A:     [.5,   2,   6],
  K:     [.4, 1.5,   4],
  Q:     [.3,   1,   3],
  J:     [.25, .8,   2],
  '10':  [.2,  .6, 1.5],
};

// 15 paylines on 5×5 grid [row, col] per reel, left→right
const LINES = [
  [[2,0],[2,1],[2,2],[2,3],[2,4]], // centre row
  [[0,0],[0,1],[0,2],[0,3],[0,4]], // top row
  [[4,0],[4,1],[4,2],[4,3],[4,4]], // bottom row
  [[1,0],[1,1],[1,2],[1,3],[1,4]], // row 1
  [[3,0],[3,1],[3,2],[3,3],[3,4]], // row 3
  [[0,0],[1,1],[2,2],[1,3],[0,4]], // V-shape up
  [[4,0],[3,1],[2,2],[3,3],[4,4]], // V-shape down
  [[2,0],[1,1],[0,2],[1,3],[2,4]], // M-shape
  [[2,0],[3,1],[4,2],[3,3],[2,4]], // W-shape
  [[0,0],[1,1],[2,2],[3,3],[4,4]], // diagonal ↘
  [[4,0],[3,1],[2,2],[1,3],[0,4]], // diagonal ↗
  [[1,0],[0,1],[1,2],[0,3],[1,4]], // top zigzag
  [[3,0],[4,1],[3,2],[4,3],[3,4]], // bottom zigzag
  [[0,0],[2,1],[4,2],[2,3],[0,4]], // steep V
  [[4,0],[2,1],[0,2],[2,3],[4,4]], // steep inv-V
];

// ── Wizard multiplier RNG ─────────────────────────────────
// Weighted toward low values but with a fat tail to 2000
function pickMult(){
  const t=[
    {a:2,   b:8,   w:30},
    {a:9,   b:20,  w:22},
    {a:21,  b:50,  w:16},
    {a:51,  b:100, w:11},
    {a:101, b:200, w:8 },
    {a:201, b:400, w:6 },
    {a:401, b:700, w:4 },
    {a:701, b:1200,w:2 },
    {a:1201,b:2000,w:1 },
  ];
  const tot=t.reduce((s,x)=>s+x.w,0);
  let r=Math.random()*tot;
  for(const x of t){r-=x.w;if(r<=0)return rand(x.a,x.b);}
  return 2;
}
function rand(a,b){return Math.floor(Math.random()*(b-a+1))+a;}

// Chance of wizard landing on a reel each spin
function wizChance(vol,isFree){
  const base = vol==='low'?.12 : vol==='high'?.30 : .20;
  return isFree ? base*1.5 : base;  // higher frequency in free spins
}

// ── Game state ────────────────────────────────────────────
let grid    = [];        // grid[r][c] = symId
let wizReels= {};        // col → multiplier (sticky during FS)
let newWizCols = [];     // wizard reels landing THIS spin (not yet sticky)

let balance  = 1000;
const BETS   = [.20,.50,1,2,5,10,20,50,100];
let betI     = 2;
let bet      = BETS[betI];
let vol      = 'med';
let freeSpins= 0;
let running  = false;

// ── DOM helpers ───────────────────────────────────────────
function $(id){return document.getElementById(id);}
function delay(ms){return new Promise(r=>setTimeout(r,ms));}
function fmt(n){return'$'+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});}

function buildGrid(){
  const el=$('grid'); el.innerHTML='';
  for(let r=0;r<R;r++) for(let c=0;c<C;c++){
    const d=document.createElement('div');
    d.className='cell'; d.id=`c${r}${c}`;
    d.innerHTML=`<span class="icon">🔮</span><span class="lbl">---</span>`;
    el.appendChild(d);
  }
}

function cell(r,c){return $(`c${r}${c}`);}

function setCell(r,c,symId,preserveWiz){
  const el=cell(r,c); if(!el)return;
  const isWiz = preserveWiz && wizReels[c]!==undefined;
  el.classList.toggle('wiz',isWiz);
  // remove overlays
  el.querySelectorAll('.mbadge,.reveal,.spip').forEach(e=>e.remove());
  const s=SYM[isWiz?'wiz':symId]||SYM['10'];
  el.innerHTML=`<span class="icon">${s.e}</span><span class="lbl">${s.l}</span>`;
  if(isWiz){
    // multiplier badge on middle row
    if(r===2){
      const b=document.createElement('div');
      b.className='mbadge '+mClass(wizReels[c]);
      b.textContent=`×${wizReels[c]}`;
      el.appendChild(b);
    }
    const p=document.createElement('div');p.className='spip';p.textContent='sticky';
    el.appendChild(p);
  }
}

function mClass(v){
  if(v>=500) return 'm-x';
  if(v>=100) return 'm-b';
  if(v>=10)  return 'm-m';
  return 'm-s';
}

function renderGrid(preserveWiz){
  for(let r=0;r<R;r++) for(let c=0;c<C;c++){
    setCell(r,c,grid[r]?.[c]||'10',preserveWiz);
  }
}

function setSpinning(on){
  for(let r=0;r<R;r++) for(let c=0;c<C;c++){
    cell(r,c)?.classList.toggle('spin',on);
  }
}

function flashWins(winCells){
  for(const k of winCells){
    const [r,c]=k.split(',').map(Number);
    const el=cell(r,c); if(!el)continue;
    el.classList.remove('wflash'); void el.offsetWidth;
    el.classList.add('wflash');
    setTimeout(()=>el.classList.remove('wflash'),1700);
  }
}

function setStatus(m){$('status').textContent=m;}

function setUI(on){
  $('spinBtn').disabled=!on;
  $('bdn').disabled=!on;
  $('bup').disabled=!on;
  $('spinBtn').classList.toggle('go',!on);
}

function updateDisplay(){
  $('bal').textContent=fmt(balance);
  if(freeSpins>0){
    $('fsBanner').classList.add('show');
    $('fsNum').textContent=freeSpins;
  }else{
    $('fsBanner').classList.remove('show');
  }
}

function showWin(total, details){
  if(!total){
    $('wamt').classList.remove('show');
    $('wlbl').classList.remove('show');
    $('wdet').classList.remove('show');
    return;
  }
  $('lastWin').textContent=fmt(total);
  $('wlbl').classList.add('show');
  $('wamt').textContent=fmt(total);
  $('wamt').classList.add('show');
  if(details.length){
    const tx=details.map(d=>{
      const s=SYM[d.sym]; let t=`${s.e}×${d.count}`;
      if(d.msum>0) t+=` <span style="color:#ffd700">(+${d.msum}×)</span>`;
      return t;
    }).join('  ');
    $('wdet').innerHTML=tx;
    $('wdet').classList.add('show');
  }
  // big win check
  const mult=total/bet;
  if(mult>=50){
    const bwl=$('bwl');
    bwl.textContent=mult>=400?'MEGA WIN!!! 🧙✨':mult>=150?'SUPER WIN!! 🌟':'BIG WIN! 🔮';
    $('bwa').textContent=fmt(total);
    $('bigwin').classList.add('show');
  }
}

function setScatterDots(n){
  for(let i=0;i<3;i++) $(`s${i}`)?.classList.toggle('lit',i<n);
}

// ── RNG: generate grid symbols ────────────────────────────
function genGrid(isFree){
  newWizCols=[];
  // decide which reels get a wizard this spin
  for(let c=0;c<C;c++){
    if(wizReels[c]!==undefined) continue; // already sticky
    if(Math.random()<wizChance(vol,isFree)) newWizCols.push(c);
  }

  const wk=vol==='low'?'wL':vol==='high'?'wH':'wM';
  const pool=SYMS.filter(s=>s.id!=='wiz');
  const total=pool.reduce((s,x)=>s+x[wk],0);

  grid=[];
  for(let r=0;r<R;r++){
    grid[r]=[];
    for(let c=0;c<C;c++){
      if(wizReels[c]!==undefined || newWizCols.includes(c)){
        grid[r][c]='wiz'; continue;
      }
      let rv=Math.random()*total, chosen=pool[pool.length-1].id;
      for(const s of pool){rv-=s[wk];if(rv<=0){chosen=s.id;break;}}
      grid[r][c]=chosen;
    }
  }
}

// ── Wizard reel animation ─────────────────────────────────
// Expand reel → show 2 multiplier options → pick 1 → lock in
async function animateWizard(col, m1, m2, chosen){
  // 1. All cells in this col drop in as wizard
  for(let r=0;r<R;r++){
    const el=cell(r,col); if(!el)continue;
    el.classList.remove('spin');
    el.classList.add('wiz','dropping');
    el.querySelectorAll('.mbadge,.reveal,.spip').forEach(e=>e.remove());
    el.innerHTML=`<span class="icon">🧙</span><span class="lbl">WILD</span>`;
    setTimeout(()=>el.classList.remove('dropping'),550);
  }
  await delay(520);

  // 2. Reveal two options on the middle cell
  const mid=cell(2,col);
  if(mid){
    const rv=document.createElement('div'); rv.className='reveal';
    const o1=document.createElement('div'); o1.className='ropt'; o1.textContent=`×${m1}`;
    const o2=document.createElement('div'); o2.className='ropt'; o2.textContent=`×${m2}`;
    rv.appendChild(o1); rv.appendChild(o2); mid.appendChild(rv);
  }
  await delay(650);

  // 3. Choose one
  if(mid){
    const rv=mid.querySelector('.reveal');
    if(rv){
      const opts=rv.querySelectorAll('.ropt');
      const ci=chosen===m1?0:1;
      opts[ci].classList.add('pick');
      opts[1-ci].classList.add('drop');
    }
  }
  await delay(750);

  // 4. Remove reveal, add persistent multiplier badge
  if(mid){
    mid.querySelector('.reveal')?.remove();
    mid.querySelectorAll('.mbadge').forEach(e=>e.remove());
    const b=document.createElement('div');
    b.className='mbadge '+mClass(chosen);
    b.textContent=`×${chosen}`;
    mid.appendChild(b);
  }
  // Sticky pip on all cells
  for(let r=0;r<R;r++){
    const el=cell(r,col); if(!el)continue;
    el.querySelectorAll('.spip').forEach(e=>e.remove());
    const p=document.createElement('div'); p.className='spip'; p.textContent='sticky';
    el.appendChild(p);
  }
}

// ── Win evaluation ────────────────────────────────────────
function evaluate(){
  let total=0;
  const winCells=new Set();
  const details=[];

  for(const line of LINES){
    let match=null, count=0;
    for(let i=0;i<C;i++){
      const s=grid[line[i][0]][line[i][1]];
      if(s==='wiz'){count++;}
      else if(!match){match=s;count++;}
      else if(s===match){count++;}
      else break;
    }
    if(!match||count<3||!PAY[match]) continue;

    const base=PAY[match][count-3];
    // ADD multipliers from all wizard reels on this line segment
    let msum=0;
    for(let i=0;i<count;i++){
      const cc=line[i][1];
      if(wizReels[cc]!==undefined) msum+=wizReels[cc];
    }
    const lineMult=Math.max(1,msum);
    const win=bet*base*lineMult;
    total+=win;
    for(let i=0;i<count;i++) winCells.add(`${line[i][0]},${line[i][1]}`);
    details.push({sym:match,count,base,msum,lineMult,win});
  }
  return{total,winCells,details};
}

// ── Main spin ─────────────────────────────────────────────
async function spin(){
  if(running) return;
  const isFree=freeSpins>0;

  if(!isFree){
    if(balance<bet){setStatus('Insufficient balance!');return;}
    balance-=bet;
  }

  running=true;
  setUI(false);
  $('wamt').classList.remove('show');
  $('wlbl').classList.remove('show');
  $('wdet').classList.remove('show');
  setScatterDots(0);
  setStatus(isFree?`Free Spin! ${freeSpins} remaining…`:'Spinning…');
  updateDisplay();

  // Spin animation
  setSpinning(true);
  await delay(420+Math.random()*150);

  genGrid(isFree);

  // Stop spinning — render non-wizard cells
  setSpinning(false);
  renderGrid(true); // preserveWiz=true for sticky reels
  await delay(80);

  // ── Wizard animations ────────────────────────────────
  if(newWizCols.length){
    const wizAnims=[];
    for(const col of newWizCols){
      const m1=pickMult(), m2=pickMult();
      const chosen=Math.random()<.5?m1:m2;
      wizReels[col]=chosen;
      wizAnims.push(animateWizard(col,m1,m2,chosen));
    }
    await Promise.all(wizAnims);

    const wizMsg=newWizCols.map(c=>`Reel ${c+1}: ×${wizReels[c]}`).join(' · ');
    setStatus(`🧙 Wizard Wild! ${wizMsg}`);
    await delay(250);
  }

  // ── Scatter count ────────────────────────────────────
  let scatters=0;
  for(let r=0;r<R;r++) for(let c=0;c<C;c++){
    if(grid[r][c]==='bonus') scatters++;
  }
  setScatterDots(Math.min(scatters,3));

  // ── Evaluate wins ─────────────────────────────────────
  const {total,winCells,details}=evaluate();

  if(winCells.size) flashWins(winCells);
  if(total>0){
    balance+=total;
    showWin(total,details);
  }

  updateDisplay();

  // ── Free spins trigger ───────────────────────────────
  if(scatters>=3 && !isFree){
    const award=scatters===3?10:scatters===4?15:20;
    freeSpins+=award;
    updateDisplay();
    setStatus(`⭐ ${award} Free Spins triggered! Wizard Wilds now sticky.`);
    await delay(900);
  } else if(isFree && scatters>=3){
    freeSpins+=5; // retrigger
    updateDisplay();
    setStatus(`⭐ +5 Free Spins!`);
    await delay(600);
  }

  // ── Free spin countdown ──────────────────────────────
  if(isFree){
    freeSpins--;
    if(freeSpins<=0){
      freeSpins=0;
      wizReels={};  // clear sticky wilds when FS ends
      updateDisplay();
      setStatus('Free Spins complete!');
    } else {
      if(!newWizCols.length && !total) setStatus(`${freeSpins} free spin${freeSpins===1?'':'s'} remaining…`);
    }
  } else if(!newWizCols.length && !total && scatters<3){
    setStatus(idleMsg());
  }

  updateDisplay();
  running=false;
  setUI(true);

  // auto-continue free spins
  if(freeSpins>0){
    await delay(700);
    spin();
  }
}

function idleMsg(){
  const m=['The crystal stirs…','Magic takes time…','Fortunes align…','The wizard watches…','Ancient power builds…'];
  return m[Math.floor(Math.random()*m.length)];
}

// ── Bet / vol controls ────────────────────────────────────
function chgBet(d){
  betI=Math.max(0,Math.min(BETS.length-1,betI+d));
  bet=BETS[betI];
  $('betVal').textContent=fmt(bet);
}
function setVol(v,el){
  vol=v;
  document.querySelectorAll('.vopt').forEach(e=>e.classList.remove('on'));
  el.classList.add('on');
}

// ── Init ─────────────────────────────────────────────────
buildGrid();
// Show a random initial grid
genGrid(false);
renderGrid(false);
updateDisplay();
</script>
