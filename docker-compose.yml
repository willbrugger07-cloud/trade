version: '3.9'

# Neon Overload — Microservices Stack
# Run: docker-compose up --build
# In production: add Redis, PostgreSQL, NATS services here.

services:

  ledger:
    build:
      context: .
      dockerfile: Dockerfile.services
    command: node services/ledger-service.js
    environment:
      - LEDGER_PORT=3002
    ports:
      - "3002:3002"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3002/account/health"]
      interval: 10s
      retries: 3

  math:
    build:
      context: .
      dockerfile: Dockerfile.services
    command: node services/math-service.js
    environment:
      - MATH_PORT=3001
      - LEDGER_PORT=3002
    ports:
      - "3001:3001"
    depends_on:
      - ledger
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 10s
      retries: 3

  wallet-sync:
    build:
      context: .
      dockerfile: Dockerfile.services
    command: node services/wallet-sync-service.js
    environment:
      - SYNC_PORT=3003
      - LEDGER_PORT=3002
      - SETTLEMENT_INTERVAL_MS=60000
      # Set these to real wallet addresses in production:
      - HOT_WALLET_ADDRESS=0xHOT_WALLET_ADDRESS
      - WARM_WALLET_ADDRESS=0xWARM_WALLET_ADDRESS
      - COLD_WALLET_ADDRESS=0xCOLD_WALLET_ADDRESS
    ports:
      - "3003:3003"
    depends_on:
      - ledger
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: Dockerfile.services
    command: node services/gateway.js
    environment:
      - PORT=3000
      - MATH_PORT=3001
      - LEDGER_PORT=3002
      - SYNC_PORT=3003
    ports:
      - "3000:3000"
    depends_on:
      - math
      - ledger
      - wallet-sync
    restart: unless-stopped

